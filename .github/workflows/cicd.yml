#this is name of the workflow that will be displayed in the actions Tab
name: CICD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: This is the environment value where this workflow runs
        default: :'dev'
        required: true
        type: choice
        options:
          - dev
          - prod
          - staging

jobs:

  code:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        run: echo "Code Clone from Github"
  build:
    needs: [code]
    runs-on: ubuntu-latest
    steps:
      - name: Build the docker container
        run: echo "Testing the container"
  test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Test the container
        run: echo "Testing the container"
        
  deploy:
    if: inputs.environment == 'dev'
    needs: [build,test]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the container
        run: echo "Deploying the container"
        
